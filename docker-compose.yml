
services:

  # 🔴 ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 🔴 KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 🔴 REDIS
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 🟢 USER SERVICE
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - wallet-service

  # 🟢 WALLET SERVICE
  wallet-service:
    build: ./wallet-service
    ports:
      - "8088:8088"

  # 🟢 TRANSACTION SERVICE
  transaction-service:
    build: ./transaction-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka

  # 🟢 NOTIFICATION SERVICE
  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka

  # 🟢 REWARD SERVICE
  reward-service:
    build: ./reward-service
    ports:
      - "8089:8089"
    depends_on:
      - kafka

  # 🟢 API GATEWAY
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - transaction-service
      - notification-service
      - reward-service
      - redis
