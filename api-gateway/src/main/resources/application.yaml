server:
  port: 8080

spring:
  application:
    name: api-gateway
  output:
    ansi:
      enabled: always

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**

        - id: reward-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/rewards/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE


#management:
#  endpoints:
#    web:
#      exposure:
#        include: "*"


  debug:
    true

